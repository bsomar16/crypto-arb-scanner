name: oos-4h-setup-regime-rolling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oos_4h_setup_regime_rolling.py'
      - 'signals.py'
      - 'entry_engine.py'
      - 'live_replay.py'
      - 'config.json'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rolling setup/regime OOS study
        run: python oos_4h_setup_regime_rolling.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-setup-regime-rolling
          path: state/oos_4h_setup_regime_rolling.json
          if-no-files-found: error
