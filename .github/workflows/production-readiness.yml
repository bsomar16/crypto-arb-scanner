name: production-readiness

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production readiness audit
        run: python production_readiness.py
      - name: Execution safety tests
        run: python -m unittest tests.test_production_readiness -v
