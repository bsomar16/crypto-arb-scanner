name: oos-4h-loss-taxonomy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'oos_4h_loss_taxonomy.py'
      - 'signals.py'
      - 'entry_engine.py'
      - 'live_replay.py'
      - 'config.json'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run descriptive 4h loss taxonomy
        run: python oos_4h_loss_taxonomy.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-loss-taxonomy
          path: state/oos_4h_loss_taxonomy.json
          if-no-files-found: error
