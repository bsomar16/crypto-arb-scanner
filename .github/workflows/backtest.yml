name: Historical crypto backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"
  push:
    branches: ["main"]
    paths:
      - "backtest.py"
      - "signals.py"
      - "signal_history.py"
      - "config.json"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run historical backtest
        run: |
          python backtest.py
      - name: Persist compact historical stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/backtest_stats.json
          if git diff --cached --quiet; then
            echo "No backtest-stat changes."
          else
            git commit -m "chore: refresh historical backtest stats [skip ci]"
            git push
          fi
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-backtest-report
          path: state/backtest_stats.json
          retention-days: 30
