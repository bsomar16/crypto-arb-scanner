name: Historical Signal Statistics

on:
  schedule:
    - cron: "25 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    concurrency:
      group: backtest-stats
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate historical signal statistics
        run: python generate_backtest_stats.py
      - name: Commit historical statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/backtest_stats.json)" ]; then
            git add state/backtest_stats.json
            git commit -m "Update historical signal statistics"
            git push
          else
            echo "No statistics changes"
          fi
