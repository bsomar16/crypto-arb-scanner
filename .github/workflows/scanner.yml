name: Crypto Signal Bot

on:
  # Staggered 15-minute scans. BUY runs every 15 minutes; ARB runs every 15 minutes.
  schedule:
    - cron: "7,22,37,52 * * * *"   # arbitrage scan
    - cron: "2,17,32,47 * * * *"   # multi-timeframe BUY signals
    - cron: "7 8 * * *"            # daily crypto report 08:07 UTC
    - cron: "10 12 * * 1"          # weekly backtest, Monday 12:10 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "buy"
        type: choice
        options:
          - buy
          - daily
          - arb
          - price
          - backtest
          - check
          - report
          - all

permissions:
  contents: write

jobs:
  arb-scan:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'arb')
    runs-on: ubuntu-latest
    concurrency:
      group: arb-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crypto arbitrage scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode arb
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  buy-signals:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '2,17,32,47 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'buy') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
    runs-on: ubuntu-latest
    concurrency:
      group: buy-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run multi-timeframe crypto BUY scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode buy
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  daily-picks:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '7 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
    runs-on: ubuntu-latest
    concurrency:
      group: daily-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily crypto report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode daily
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  weekly-backtest:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '10 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest')
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-backtest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run weekly crypto backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode backtest

  position-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    concurrency:
      group: position-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Follow-up crypto check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode check
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  signal-report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    concurrency:
      group: signal-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate crypto signal report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode report --report-format html
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-report
          path: state/report.html
          if-no-files-found: warn
