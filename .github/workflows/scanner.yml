name: Crypto Signal Bot

on:
  schedule:
    # Run buy signals every 5 minutes
    - cron: '*/5 * * * *'
    # Run daily crypto report every day at 08:00 UTC (09:00 CET)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "buy"
        type: choice
        options:
          - buy
          - daily
          - arb
          - price
          - backtest
          - check
          - report
          - all

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  buy-signals:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'buy' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: buy-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run trade tracking/status cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python position_status.py
      - name: Run multi-timeframe crypto BUY scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode buy
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  arb-scan:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'arb'
    runs-on: ubuntu-latest
    concurrency:
      group: arb-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run crypto arbitrage scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode arb
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  daily-picks:
    if: |
      (github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
    runs-on: ubuntu-latest
    concurrency:
      group: daily-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily crypto report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode daily
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  weekly-backtest:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest'
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-backtest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run weekly crypto backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode backtest

  position-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    concurrency:
      group: position-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Follow-up crypto check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode check
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  signal-report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    concurrency:
      group: signal-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate crypto signal report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode report --report-format html
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-signal-report
          path: state/report.html
          if-no-files-found: warn
