name: Crypto Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # arb scan every 15 min
    - cron: "0 * * * *"      # intraday BUY signals every hour
    - cron: "0 8 * * *"      # daily report 08:00 UTC (match config.json daily_hour_utc)
    - cron: "0 12 * * 1"     # weekly backtest, Monday 12:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "buy"
        type: choice
        options:
          - buy
          - daily
          - arb
          - price
          - backtest
          - check
          - report
          - all

permissions:
  contents: write

jobs:
  arb-scan:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'arb')
    runs-on: ubuntu-latest
    concurrency:
      group: arb-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run arb scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode arb
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  buy-signals:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'buy') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
    runs-on: ubuntu-latest
    concurrency:
      group: buy-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run intraday buy-signal scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode buy
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  daily-picks:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'all')
    runs-on: ubuntu-latest
    concurrency:
      group: daily-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode daily
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  weekly-backtest:
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'backtest')
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-backtest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run weekly backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode backtest

  position-check:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    concurrency:
      group: position-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Follow-up check (positions + spreads)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode check
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done

  signal-report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    concurrency:
      group: signal-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate signal report
        id: report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --mode report --report-format html
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-report
          path: state/report.html
          if-no-files-found: warn
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" && git push && break
            else
              echo "No changes"
              break
            fi
            sleep 8
          done