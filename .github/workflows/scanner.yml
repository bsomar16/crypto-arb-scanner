name: Crypto Signal Bot

on:
  # GitHub Actions is the authoritative scheduler. External cron services are not required.
  schedule:
    - cron: "2,17,32,47 * * * *"   # multi-timeframe BUY signals
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode to run"
        required: true
        default: "buy"
        type: choice
        options:
          - buy

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  buy-signals:
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'buy')
    runs-on: ubuntu-latest
    concurrency:
      group: buy-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run trade tracking/status cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python position_status.py
      - name: Run multi-timeframe crypto BUY scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
        run: python scanner.py --mode buy
      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "Update bot state $(date -u +%Y-%m-%dT%H:%M)" || true
            else
              echo "No local state changes"
            fi
            git pull --rebase origin main && git push && break
            sleep 8
          done
