name: oos-4h-five-window-tp1-holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'oos_4h_five_window_tp1_holdout.py'
      - 'oos_4h_exit_policy.py'
      - 'signals.py'
      - 'entry_engine.py'
      - 'live_replay.py'
      - 'config.json'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run five-window TP1 holdout study
        run: python oos_4h_five_window_tp1_holdout.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-five-window-tp1-holdout
          path: state/oos_4h_five_window_tp1_holdout.json
          if-no-files-found: error
