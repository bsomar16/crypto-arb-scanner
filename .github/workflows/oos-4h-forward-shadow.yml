name: oos-4h-forward-shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_forward_shadow_4h.py'
  schedule:
    - cron: "7 */4 * * *"

permissions:
  contents: write

concurrency:
  group: oos-4h-forward-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4h forward shadow
        run: python research_forward_shadow_4h.py

      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-forward-shadow
          path: state/forward_shadow_4h.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/forward_shadow_4h.json
          if git diff --cached --quiet; then
            echo "No research state changes to commit."
            exit 0
          fi
          git commit -m "Update 4h forward shadow research state"
          git push origin HEAD:main
