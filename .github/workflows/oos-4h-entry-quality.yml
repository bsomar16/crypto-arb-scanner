name: oos-4h-entry-quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'entry_quality_study.py'
      - 'signals.py'
      - 'entry_engine.py'
      - 'live_replay.py'
      - 'config.json'
      - '.github/workflows/oos-4h-entry-quality.yml'

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 4h entry-quality OOS study
        run: python entry_quality_study.py
      - name: Upload 4h OOS entry-quality report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-entry-quality
          path: state/oos_4h_entry_quality.json
          if-no-files-found: error
