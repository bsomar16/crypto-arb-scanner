name: Unit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: >-
          python -m py_compile scanner.py botutil.py markets.py signals.py indicators.py traps.py
          store.py positions.py portfolio.py backtest.py execution_guard.py execution_engine.py
          exchange_adapter.py realtime_arb.py realtime_market.py realtime_opportunity.py
          adapters/http.py adapters/binance.py adapters/bybit.py adapters/okx.py
