name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: >-
          python -m py_compile scanner.py botutil.py markets.py signals.py discovery.py indicators.py
          traps.py store.py positions.py position_monitor.py portfolio.py backtest.py realtime.py trade_journal.py risk_engine.py
          partial_tp.py live_tp_manager.py execution_guard.py execution_engine.py execution_recovery.py execution_monitor.py transfer_tracker.py
          two_leg_execution.py two_leg_executor.py exchange_adapter.py adapter_factory.py order_constraints.py
          realtime_arb.py realtime_market.py realtime_opportunity.py orderbook_depth.py network_routes.py
          signal_history.py telegram_control.py adapters/http.py adapters/binance.py
          adapters/bybit.py adapters/okx.py adapters/bitget_spot.py adapters/mexc_spot.py
