name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: >-
          python -m py_compile scanner.py abt_strategy.py adaptive.py alerts.py botutil.py bullish_potential.py
          component_quality.py discovery.py entry_engine.py expansion.py exposure.py indicators.py market_regime.py
          markets.py multi_exchange.py outcome_attribution.py position_monitor.py position_state.py position_status.py
          positions.py risk_engine.py shadow_trading.py signal_audit.py signal_context.py signal_history.py
          signal_lifecycle.py signal_outcomes.py signals.py store.py target_quality.py trade_journal.py
