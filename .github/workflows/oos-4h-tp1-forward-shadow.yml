name: oos-4h-tp1-forward-shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_forward_shadow_4h_tp1.py'
      - 'signals.py'
      - 'entry_engine.py'
      - 'live_replay.py'
      - 'config.json'
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: oos-4h-tp1-forward-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run TP1 forward shadow
        run: python research_forward_shadow_4h_tp1.py
      - name: Upload research state
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-tp1-forward-shadow
          path: state/forward_shadow_4h_tp1.json
          if-no-files-found: error
          retention-days: 30
      - name: Persist research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/forward_shadow_4h_tp1.json
          if git diff --cached --quiet; then
            echo "No TP1 research state changes to commit."
            exit 0
          fi
          git commit -m "Update 4h TP1 forward shadow research state"
          git push origin HEAD:main
