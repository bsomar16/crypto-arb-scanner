name: "Research: 4h candidate asset holdout"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "oos_4h_candidate_holdout.py"
      - "signals.py"
      - "entry_engine.py"
      - "live_replay.py"
      - "config.json"
      - ".github/workflows/oos-4h-candidate-holdout.yml"
  push:
    branches: [main]
    paths:
      - "oos_4h_candidate_holdout.py"
      - "signals.py"
      - "entry_engine.py"
      - "live_replay.py"
      - "config.json"
      - ".github/workflows/oos-4h-candidate-holdout.yml"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run candidate holdout study
        run: python oos_4h_candidate_holdout.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-candidate-holdout
          path: state/oos_4h_candidate_holdout.json
          if-no-files-found: error
