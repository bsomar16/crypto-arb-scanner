name: expectancy-report

# On-demand, read-only: never commits. Optionally backfills grades first so the
# report runs on a wider sample than the (region-limited) live grader has managed.
on:
  workflow_dispatch:
    inputs:
      fee_bps:
        description: "Fee per side, basis points"
        required: false
        default: "10"
      slippage_bps:
        description: "Slippage per side, basis points"
        required: false
        default: "5"
      backfill_limit:
        description: "Grade up to N ungraded signals first (0 = skip)"
        required: false
        default: "0"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill outcomes (optional)
        if: ${{ inputs.backfill_limit != '0' }}
        run: |
          python backfill_outcomes.py \
            --limit "${{ inputs.backfill_limit }}" \
            --workers 8 \
            --out state/signal_outcomes_backfill.json
      - name: Expectancy / walk-forward report
        run: |
          OUT=state/signal_outcomes.json
          if [ -f state/signal_outcomes_backfill.json ]; then
            OUT=state/signal_outcomes_backfill.json
            echo "using backfilled outcomes"
          fi
          python expectancy_report.py \
            --outcomes "$OUT" \
            --fee-bps "${{ inputs.fee_bps }}" \
            --slippage-bps "${{ inputs.slippage_bps }}" \
            --calibrate --min-n 30 --folds 4 \
            --json-out state/expectancy_report.json | tee expectancy_report.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: expectancy-report
          path: |
            expectancy_report.txt
            state/expectancy_report.json
            state/signal_outcomes_backfill.json
          if-no-files-found: warn
