name: "Research: 4h setup-structure 20-symbol robustness"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "oos_4h_setup_structure_20symbol_robustness.py"
      - "signals.py"
      - "entry_engine.py"
      - "live_replay.py"
      - "signal_audit.py"
      - "config.json"
      - ".github/workflows/oos-4h-setup-structure-20symbol-robustness.yml"
  push:
    branches: [main]
    paths:
      - "oos_4h_setup_structure_20symbol_robustness.py"
      - "signals.py"
      - "entry_engine.py"
      - "live_replay.py"
      - "signal_audit.py"
      - "config.json"
      - ".github/workflows/oos-4h-setup-structure-20symbol-robustness.yml"

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run 20-symbol robustness study
        run: python oos_4h_setup_structure_20symbol_robustness.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: oos-4h-setup-structure-20symbol-robustness
          path: state/oos_4h_setup_structure_20symbol_robustness.json
          if-no-files-found: error
