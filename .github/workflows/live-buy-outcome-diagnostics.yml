name: Research: live BUY outcome diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "live_buy_outcome_diagnostics.py"
      - "state/trade_journal.jsonl"

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnostics
        run: python live_buy_outcome_diagnostics.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: live-buy-outcome-diagnostics
          path: state/live_buy_outcome_diagnostics.json
